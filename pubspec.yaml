name: izicard_nfc_app
description: Application Android d'encodage NFC en série pour IziCard.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'
  flutter: '>=3.29.2'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  path: ^1.9.0
  sqflite: ^2.4.1
  excel: ^4.0.6
  excel2003: ^1.0.0
  file_picker: ^10.3.11
  cross_file: ^0.3.4+2
  share_plus: ^10.1.2
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.4
  package_info_plus: ^8.1.0
  app_settings: ^5.1.1
  nfc_manager: 4.0.2
  nfc_manager_ndef: 1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
